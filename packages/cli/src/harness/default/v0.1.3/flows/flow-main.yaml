id: flow-main
version: 0.1.3
name: Letra Main Flow
description: Fluxo compatível com workspaces Letra existentes de cinco estágios.
defaultPolicy: policies/sdlc-default.json

stages:
  - id: backlog
    name: Backlog
    order: 0
    zone: todo
    description: Item registrado e aguardando priorização.
    agents: []
    gate: null

  - id: design
    name: Design
    order: 1
    zone: doing
    description: Definição de solução, restrições e aprovação de direção.
    agents: ["analyst"]
    gate: null
    activity:
      design:
        commands: [{"command":"letra validate","label":"Validar desenho"},{"command":"letra flow move <ITEM-ID> --to <NEXT-STAGE>","label":"Avançar após aprovação"}]
        objective: Definir solução, restrições e decisões antes da implementação.
        mustNotDo: ["Não implementar antes da aprovação humana da direção."]
        nextActions: [{"label":"Consolidar desenho","description":"Fechar outcome, constraints, exclusions e decisões em aberto."},{"label":"Solicitar aprovação","description":"Apresentar a direção e suas evidências para decisão humana."}]
      gate:
        objective: Preparar a aprovação humana da direção proposta.
        label: Aprovação de direção
        evidence: outcome, constraints, exclusions e decisões em aberto
        decision: Aprovar ou solicitar ajustes no desenho
        signalCode: design-approval
        nextActions: [{"label":"Preparar evidências","description":"Reunir outcome, restrições e decisões do desenho."},{"label":"Responder gate","description":"Registrar a aprovação humana ou os ajustes solicitados."}]

  - id: code
    name: Code
    order: 2
    zone: doing
    description: Implementação orientada pela spec aprovada.
    agents: ["builder"]
    gate: null
    activity:
      implement:
        commands: [{"command":"letra ac done <AC-ID>","label":"Registrar AC concluído"},{"command":"letra validate","label":"Validar implementação"}]
        objective: Implementar o item ativo conforme a spec e as restrições aprovadas.
        mustNotDo: ["Não ampliar o escopo além da spec ativa."]
        nextActions: [{"label":"Executar próximo AC","description":"Implementar o próximo critério pendente com testes."},{"label":"Verificar drift","description":"Comparar a mudança com a spec, o foco e a constitution."}]

  - id: review
    name: Review
    order: 3
    zone: doing
    description: Revisão de aderência, riscos, testes e evidências.
    agents: ["reviewer"]
    gate: null
    activity:
      review:
        commands: [{"command":"letra validate","label":"Validar evidências"},{"command":"letra diagnose","label":"Diagnosticar riscos"},{"command":"letra flow move <ITEM-ID> --to <NEXT-STAGE>","label":"Avançar após revisão"}]
        objective: Revisar aderência, riscos e evidências do item entregue.
        label: Revisão técnica
        emphasis: aderência à spec, riscos e evidências
        riskFocus: bugs, regressões e violações da constitution
        evidencePrompt: Verificar testes, build, diff e rastros operacionais.
        signalCode: technical-review
        mustNotDo: ["Não aprovar sem verificar riscos, ACs e evidências."]
        nextActions: [{"label":"Comparar com spec","description":"Verificar aderência do diff aos critérios e restrições."},{"label":"Listar riscos","description":"Destacar bugs, regressões e violações da constitution."},{"label":"Cobrar evidências","description":"Confirmar testes, build e rastros operacionais."}]

  - id: security
    name: Security
    order: 4
    zone: doing
    description: Verificação de segurança e riscos antes da conclusão.
    agents: ["security"]
    gate: null
    activity:
      diagnose:
        commands: [{"command":"letra health","label":"Inspecionar alertas"},{"command":"letra validate","label":"Validar antes da conclusão"}]
        objective: Diagnosticar riscos e sinais operacionais antes da conclusão.
        mustNotDo: ["Não ocultar alertas de alta severidade."]
        nextActions: [{"label":"Ler sinais ativos","description":"Inspecionar health, riscos e divergências do workspace."},{"label":"Priorizar impacto","description":"Tratar primeiro os riscos que bloqueiam a conclusão."}]

  - id: done
    name: Done
    order: 5
    zone: done
    description: Trabalho concluído e aceito.
    agents: []
    gate: null
