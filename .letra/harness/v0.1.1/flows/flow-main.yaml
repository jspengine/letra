id: flow-main
version: 0.1.1
name: Letra Main Flow
description: Fluxo compatível com workspaces Letra existentes de cinco estágios.
defaultPolicy: policies/sdlc-default.json

stages:
  - id: backlog
    name: Backlog
    order: 0
    zone: todo
    description: Item registrado e aguardando priorização.
    agents: []
    gate: null

  - id: design
    name: Design
    order: 1
    zone: doing
    description: Definição de solução, restrições e aprovação de direção.
    agents: ["analyst"]
    gate: null

  - id: code
    name: Code
    order: 2
    zone: doing
    description: Implementação orientada pela spec aprovada.
    agents: ["builder"]
    gate: null

  - id: review
    name: Review
    order: 3
    zone: doing
    description: Revisão de aderência, riscos, testes e evidências.
    agents: ["reviewer"]
    gate: null
    activity:
      review:
        label: Revisão técnica
        emphasis: aderência à spec, riscos e evidências
        riskFocus: bugs, regressões e violações da constitution
        evidencePrompt: Verificar testes, build, diff e rastros operacionais.
        signalCode: technical-review

  - id: security
    name: Security
    order: 4
    zone: doing
    description: Verificação de segurança e riscos antes da conclusão.
    agents: ["security"]
    gate: null

  - id: done
    name: Done
    order: 5
    zone: done
    description: Trabalho concluído e aceito.
    agents: []
    gate: null
