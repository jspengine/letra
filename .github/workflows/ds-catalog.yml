name: DS Catalog

on:
  pull_request:
    branches: ["main", "development"]
  push:
    branches: ["main", "development"]

jobs:
  storybook-catalog:
    name: Storybook Catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm -w packages/ui run typecheck
      - run: npm -w packages/ui run storybook:build
      - run: npm -w packages/ui run storybook:a11y
      - run: npm -w packages/ui run storybook:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ds-catalog-storybook
          path: |
            packages/ui/storybook-static
            packages/ui/storybook-visual-snapshots
            packages/ui/catalog/ds-catalog.json
          retention-days: 14
