<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Letra — Configuração (Web)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e5e5e5;
    --muted: #737373;
    --fg: #171717;
    --accent: #0070f3;
    --accent-soft: #e0f0ff;
    --success: #16a34a;
    --danger: #dc2626;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: min(720px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  header {
    padding: 28px 32px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 18px;
    align-items: center;
  }
  .logo {
    font-weight: 900;
    letter-spacing: -.02em;
    color: var(--fg);
    font-size: 18px;
  }
  .logo span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; }
  .progress {
    padding: 14px 32px 0;
    color: var(--muted);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
  }
  .progress b { color: var(--fg); }
  .progress-bar {
    height: 3px;
    background: var(--border);
    margin: 10px 32px 0;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar > i { display: block; height: 100%; background: var(--accent); }
  main { padding: 22px 32px 10px; }
  .step-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 12px;
    letter-spacing: -.01em;
  }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  label { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  input[type="text"] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .radio-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .radio-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    user-select: none;
  }
  .radio-card:hover { border-color: #b3d7ff; }
  .radio-card.sel { border-color: var(--accent); background: #f5fbff; }
  .radio-card .kind { font-weight: 600; font-size: 14px; }
  .radio-card .desc { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .input-row { display: flex; gap: 8px; }
  .input-row input { flex: 1; }
  button {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    padding: 8px 12px;
    border-radius: 8px;
    font-family: inherit;
    cursor: pointer;
    font-size: 13px;
  }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .chip {
    background: #f5f5f5;
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .chip .x { color: var(--muted); cursor: pointer; }
  .chip .x:hover { color: var(--danger); }
  .toggles { display: flex; flex-direction: column; gap: 10px; }
  .toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .toggle-label { font-weight: 500; }
  .toggle-sub { color: var(--muted); font-size: 12px; }
  .switch {
    width: 38px; height: 22px; border-radius: 999px; background: var(--border);
    position: relative; cursor: pointer; transition: background .2s;
  }
  .switch.on { background: var(--accent); }
  .switch::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 1px 2px rgba(0,0,0,.15);
  }
  .switch.on::after { left: 18px; }
  .preview {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    background: #fafafa;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    color: #404040;
    white-space: pre;
  }
  footer {
    padding: 14px 32px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    font-size: 12px;
  }
  .hint kbd {
    background: #f5f5f5;
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: inherit;
    color: var(--fg);
    font-size: 11px;
  }
  .error { color: var(--danger); font-size: 13px; margin-top: 6px; }
  .success {
    color: var(--success);
    font-weight: 500;
    display: flex;
    gap: 10px;
    align-items: center;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">letra<span>.</span></div>
    <div>
      <div class="sub">Configure seu primeiro workspace</div>
    </div>
  </header>

  <div class="progress">
    <div>Passo <b id="s">1</b> de 4</div>
    <div id="progress-pct">25%</div>
  </div>
  <div class="progress-bar"><i id="bar" style="width:25%"></i></div>

  <main>
    <div class="step-title" id="title">Nome do projeto</div>
    <div id="body"></div>
    <div class="error" id="error"></div>
  </main>

  <footer>
    <div class="hint"><kbd>↑↓</kbd> navegar · <kbd>Enter</kbd> confirmar · <kbd>Esc</kbd> voltar</div>
    <div style="display:flex;gap:8px;">
      <button id="btn-back" onclick="back()">Voltar</button>
      <button id="btn-next" class="primary" onclick="next()">Próximo</button>
    </div>
  </footer>
</div>

<script>
const state = { step: 0, name: '', type: 'mono', folders: [], gates: ['spec-review','code-review'] };
const typeLabels = { mono: 'Monorepo', multi: 'Multi-repositório', isolado: 'Isolado' };
const typeDescs = {
  mono: 'Um workspace com múltiplos pacotes (workspaces)',
  multi: 'Vários repositórios independentes em um workspace',
  isolado: 'Workspace sem repositório vinculado'
};
const gateLabels = { 'spec-review': 'Spec Review', 'code-review': 'Code Review', 'all-acs-passing': 'All ACS Passing', 'security-clear': 'Security Clear' };

function upd() {
  document.getElementById('s').textContent = state.step + 1;
  const pct = Math.round(((state.step + 1) / 4) * 100);
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('title').textContent = ['Nome do workspace','Selecionar pastas','Template + Gates','Preview e confirmação'][state.step];
  document.getElementById('error').textContent = '';
  document.getElementById('btn-back').style.visibility = state.step === 0 ? 'hidden' : 'visible';
  document.getElementById('btn-next').textContent = state.step === 4 ? 'Aplicar' : 'Próximo';
}

function renderName() {
  document.getElementById('body').innerHTML = `
    <div class="field">
      <label>Nome do workspace</label>
      <input id="name" type="text" value="${state.name}" placeholder="pix-credito" autofocus />
    </div>`;
  setTimeout(() => document.getElementById('name').select(), 0);
  document.getElementById('name').addEventListener('input', e => state.name = e.target.value);
  document.getElementById('name').addEventListener('keydown', e => { if (e.key === 'Enter') next(); });
}
function renderFolders() {
  const detected = [
    '~/code/creditos-api',
    '~/code/pix-gateway',
    '~/code/bb-shared',
    '~/work/outro-projeto',
    '~/personal/side-project'
  ];
  const labelFor = f => f.split('/').pop() || f;
  document.getElementById('body').innerHTML = `
    <div class="field">
      <label>Selecione os repositórios/pastas deste workspace</label>
    </div>
    <div class="toggles">
      ${detected.map(f => `
        <div class="toggle">
          <div>
            <div class="toggle-label">${labelFor(f)}</div>
            <div class="toggle-sub">${f}</div>
          </div>
          <div class="switch${state.folders.includes(f)?' on':''}" data-f="${f}"></div>
        </div>`).join('')}
    </div>`;
  document.querySelectorAll('.switch').forEach(s => {
    s.onclick = () => {
      const f = s.dataset.f;
      state.folders = state.folders.includes(f) ? state.folders.filter(x => x !== f) : [...state.folders, f];
      s.classList.toggle('on');
    };
  });
}
function renderGates() {
  document.getElementById('body').innerHTML = `
    <div class="toggles">
      ${Object.entries(gateLabels).map(([k,v]) => `
        <div class="toggle">
          <div>
            <div class="toggle-label">${v}</div>
            <div class="toggle-sub">${k}</div>
          </div>
          <div class="switch${state.gates.includes(k)?' on':''}" data-g="${k}"></div>
        </div>`).join('')}
    </div>`;
  document.querySelectorAll('.switch').forEach(s => s.onclick = () => {
    const g = s.dataset.g;
    state.gates = state.gates.includes(g) ? state.gates.filter(x => x !== g) : [...state.gates, g];
    s.classList.toggle('on');
  });
}
function renderPreview() {
  document.getElementById('body').innerHTML = `
    <div class="preview">┌─ letra workspace create (dry-run)
├── ~/.letra/workspace/${state.name || 'meu-workspace'}/
│   ├── workspace.yaml
│   └── flows/
│       └── sdlc.json
├── ~/.letra/harness/v0.1.0/
│   └── flows/
│       └── sdlc.yaml
└── Repositórios:
    ${state.folders.map(f => `    ├── ${f}/`).join('\n')}
        └── letra.link → workspace

Template: sdlc
Gates: ${state.gates.length ? state.gates.join(', ') : 'nenhum'}</div>`;
}
function next() {
  if (state.step === 0 && !state.name.trim()) { document.getElementById('error').textContent = 'Nome é obrigatório.'; return; }
  if (state.step === 1 && state.folders.length === 0) { document.getElementById('error').textContent = 'Selecione pelo menos uma pasta.'; return; }
  if (state.step === 3) { apply(); return; }
  state.step++; upd(); state.step === 0 ? renderName() : state.step === 1 ? renderFolders() : state.step === 2 ? renderGates() : renderPreview();
}
function back() { if (state.step > 0) { state.step--; upd(); render(); } }
function apply() {
  const b = document.getElementById('body');
  b.innerHTML = '<div class="success">✔ Workspace criado</div>';
  document.getElementById('btn-next').textContent = 'Fechar';
  document.getElementById('btn-next').onclick = () => {};
}
upd(); renderName();
</script>
</body>
</html>
